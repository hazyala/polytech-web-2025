name: Deploy E.O.M to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: E.O.M_Web_React/package-lock.json

      - name: Install React dependencies
        working-directory: E.O.M_Web_React
        run: npm ci

      - name: Build React site
        working-directory: E.O.M_Web_React
        run: npm run build

      - name: Assemble Pages site
        run: |
          mkdir -p _site/E.O.M_Web_React
          cp -R E.O.M_WEB/. _site/
          cp -R E.O.M_Web_React/build/. _site/E.O.M_Web_React/

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
